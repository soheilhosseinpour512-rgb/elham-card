<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برای الهام ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at center, #3b1835, #100713 75%);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Tahoma, sans-serif;
}

.stars {
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(#fff 1px, transparent 1px),
        radial-gradient(#ffd6f5 1px, transparent 1px);
    background-size: 45px 45px, 75px 75px;
    animation: sparkle 5s linear infinite;
    opacity: .55;
}

@keyframes sparkle {
    from { transform: translateY(0); }
    to { transform: translateY(-45px); }
}

.card {
    position: relative;
    width: 300px;
    height: 420px;
    perspective: 1200px;
    cursor: pointer;
    z-index: 5;
}

.front {
    position: absolute;
    inset: 0;
    border-radius: 22px;
    background: linear-gradient(145deg, #fff1fa, #c88bab);
    border: 2px solid #ffe7f7;
    box-shadow: 0 0 35px #ff72bd88;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: 1.2s;
    transform-origin: left;
    z-index: 2;
    backface-visibility: hidden;
}

.front h1 {
    color: #641044;
    font-size: 30px;
    margin: 10px;
}

.front p {
    color: #8d376d;
    font-size: 17px;
}

.heart {
    font-size: 65px;
    animation: heartbeat 1.3s infinite;
}

@keyframes heartbeat {
    50% { transform: scale(1.18); }
}

.inside {
    position: absolute;
    inset: 0;
    border-radius: 22px;
    overflow: hidden;
    background: #160914;
    box-shadow: 0 0 45px #ff4ca888;
}

.inside img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        transparent 45%,
        rgba(20, 0, 15, .9)
    );
}

.message {
    position: absolute;
    bottom: 25px;
    width: 100%;
    text-align: center;
    color: white;
    padding: 0 20px;
    text-shadow: 0 2px 8px #000;
}

.message h2 {
    font-size: 24px;
    margin: 5px;
}

.message p {
    font-size: 16px;
    line-height: 2;
}

.open .front {
    transform: rotateY(-150deg);
}

.hint {
    position: fixed;
    bottom: 25px;
    color: #ffd8ee;
    font-size: 13px;
    z-index: 10;
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="card" onclick="openCard()">

    <div class="inside">

        <img src="photo.jpg">

        <div class="overlay"></div>

        <div class="message">
            <h2>الهام عزیزم ❤️</h2>
            <p>
                روز معلم مبارکت باشه 🌹<br>
                امیدوارم همیشه حالت خوب باشه ✨
            </p>
        </div>

    </div>

    <div class="front">
        <div class="heart">💖</div>
        <h1>برای الهام</h1>
        <p>برای باز کردن کارت ضربه بزن</p>
        <div>✨ 🌹 ✨</div>
    </div>

</div>

<div class="hint">برای باز کردن کارت لمس کن ❤️</div>

<audio id="music" src="music.mp3"></audio>

<script>
function openCard() {

    document.querySelector(".card").classList.add("open");

    const music = document.getElementById("music");

    music.currentTime = 1.5;

    music.play().catch(() => {});

}
</script>

</body>
</html>
